name: Sync development checks - no deployment

on:
  push:
    branches: [main, feature/google-drive-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check auslagen/parser.js
          node --check auslagen/sw.js
          node --check auslagen/sync.js
          node --check auslagen/sync-config.js
          node --check auslagen/sync-plan.js
          node --check auslagen/sync-plan.test.cjs
          node --check auslagen/report.js
          node scripts/check-inline.cjs index.html
      - name: Existing tests
        run: |
          node auslagen/parser.test.cjs
          node auslagen/sync.test.cjs
      - name: Conservative sync planner regression tests
        run: node auslagen/sync-plan.test.cjs
      - name: Reimbursement report tests
        run: node auslagen/report.test.cjs

# Deliberately no deploy job. Go-live requires a separate reviewed change.
