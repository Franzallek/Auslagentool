name: Einmalige Vorschau - nur Branch preview/once
on:
  push:
    branches: ['preview/once']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax und Tests
        run: |
          node --check auslagen/parser.js
          node --check auslagen/sw.js
          node --check auslagen/sync.js
          node --check auslagen/sync-config.js
          node --check auslagen/sync-plan.js
          node --check auslagen/report.js
          node --check auslagen/receipt-pdf.js
          node --check auslagen/pdfimport.js
          node scripts/check-inline.cjs index.html
          node scripts/check-inline.cjs auslagen/index.html
          node auslagen/parser.test.cjs > /dev/null
          node auslagen/sync.test.cjs
          node auslagen/sync-plan.test.cjs
          node auslagen/report.test.cjs
          node auslagen/receipt-pdf.test.cjs
          node auslagen/pdfimport.test.cjs
      - name: Tesseract-Integritaet und Schluessel-Suche
        shell: bash
        run: |
          set -euo pipefail
          for name in tesseract-core.wasm.js tesseract-core-simd.wasm.js tesseract-core-lstm.wasm.js tesseract-core-simd-lstm.wasm.js; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 90 "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/$name" -o "$RUNNER_TEMP/$name"
            cmp --silent "auslagen/vendor/core/$name" "$RUNNER_TEMP/$name" || { echo "Integritaetsfehler: $name"; exit 1; }
            echo "Originaldatei bestaetigt: $name"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys
          verified = {
              'auslagen/vendor/core/tesseract-core.wasm.js',
              'auslagen/vendor/core/tesseract-core-simd.wasm.js',
              'auslagen/vendor/core/tesseract-core-lstm.wasm.js',
              'auslagen/vendor/core/tesseract-core-simd-lstm.wasm.js',
          }
          pattern = re.compile(rb'sk_live|sk_test|service_role|Bearer [A-Za-z0-9._-]{20,}|api[_-]?key|BEGIN (RSA|PRIVATE)|ghp_|AKIA[0-9A-Z]{16}|GOCSPX-|client_secret')
          paths = [Path('index.html')] + sorted(Path('auslagen').rglob('*'))
          bad = False
          for path in paths:
              if not path.is_file() or path.suffix not in {'.html', '.js', '.mjs', '.cjs', '.webmanifest'}:
                  continue
              if path.as_posix() in verified:
                  continue
              if pattern.search(path.read_bytes()):
                  print('Verdaechtiger Treffer: ' + path.as_posix())
                  bad = True
          sys.exit(1 if bad else 0)
          PY
      - name: Altlasten-Suche
        run: |
          if grep -Fn -e console.log -e jsdelivr -e projectnaptha -e unsafe-eval -e 'Lorem ipsum' index.html auslagen/sw.js auslagen/parser.js auslagen/sync.js auslagen/report.js auslagen/receipt-pdf.js; then echo "Altlast gefunden"; exit 1; fi
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        env:
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          mkdir _site
          cp -r auslagen/. _site/
          cp index.html _site/index.html
          cp -r vendor _site/vendor
          printf '{"pushedAt":"%s","commit":"%s"}\n' "$PUSHED_AT" "$GITHUB_SHA" > _site/build-info.json
          rm -f _site/*.test.cjs _site/setup-vendor.mjs _site/setup-vendor.sh _site/_headers _site/README.md
          for asset in sync-config.js sync.js; do
            test -s "_site/$asset" || { echo "Fehlendes App-Asset: $asset"; exit 1; }
            grep -Fq "src=\"$asset\"" _site/index.html || { echo "App-Einstieg laedt $asset nicht."; exit 1; }
          done
          if ! grep -Fq 'for(const id of chosen.keys())cloudPurged[id]=true;' _site/sync.js; then
            echo "Explizite Loeschmarkierungen fehlen im Sync-Modul."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
