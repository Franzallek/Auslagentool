name: Einmalige Vorschau - nur Branch preview/once

on:
  push:
    branches: ['preview/once']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax und Tests
        run: |
          node --check auslagen/parser.js
          node --check auslagen/sw.js
          node --check auslagen/sync.js
          node --check auslagen/sync-config.js
          node --check auslagen/sync-plan.js
          node scripts/check-inline.cjs index.html
          node auslagen/parser.test.cjs > /dev/null
          node auslagen/sync.test.cjs
          node auslagen/sync-plan.test.cjs
      - name: Schluessel-Suche in ausgelieferten Dateien
        run: |
          if grep -rEn "sk_live|sk_test|service_role|Bearer [A-Za-z0-9._-]{20,}|api[_-]?key|BEGIN (RSA|PRIVATE)|ghp_|AKIA[0-9A-Z]{16}|GOCSPX-|client_secret" index.html auslagen --include=*.html --include=*.js --include=*.cjs --include=*.webmanifest; then echo "Verdaechtiger Treffer"; exit 1; fi
      - name: Altlasten-Suche
        run: |
          if grep -Fn -e console.log -e jsdelivr -e projectnaptha -e unsafe-eval -e 'Lorem ipsum' index.html auslagen/sw.js auslagen/parser.js auslagen/sync.js; then echo "Altlast gefunden"; exit 1; fi

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r auslagen/. _site/
          cp index.html _site/index.html
          cp -r vendor _site/vendor
          rm -f _site/*.test.cjs _site/setup-vendor.mjs _site/setup-vendor.sh _site/_headers _site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
